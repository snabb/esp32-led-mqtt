[package]
description  = "Bare-metal ESP32-C6 LED strip firmware with Wi-Fi and Home Assistant MQTT control"
edition      = "2024"
keywords     = ["esp32", "led", "mqtt", "no-std", "ws2812"]
license      = "MIT"
name         = "esp32-led-mqtt"
readme       = "README.md"
repository   = "https://github.com/snabb/esp32-led-mqtt"
rust-version = "1.97"
version      = "0.1.0"

[[bin]]
name = "esp32-led-mqtt"
path = "./src/main.rs"

[features]
default = ["mdns", "mqtt"]
heap-stats = ["esp-alloc/internal-heap-stats"]
coap = ["dep:mai-coap", "dep:rand_core", "embassy-net/udp", "_control"]
mdns = [
  "dep:edge-mdns",
  "dep:edge-nal",
  "dep:edge-nal-embassy",
  "embassy-net/multicast",
  "embassy-net/udp",
]
mqtt = ["dep:minimq", "_control"]
# Implied by any remote control plane: OTA downloads, TLS and the temperature sampler.
_control = ["dep:mbedtls-rs", "dep:time"]

[dependencies]
smart-leds = "0.4.0"
heapless = { version = "0.9.3", features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde-json-core = "0.7.0"
digest = { version = "0.11.3", default-features = false }
sequential-storage = "8.0.2"
embedded-storage-async = "0.4.1"
log = "0.4.35"
mai-coap = { git = "https://github.com/snabb/mai-coap.git", rev = "d83f3c4da63a67273a858fc96b7fd032d82676bf", default-features = false, features = [
  "block1",
  "discovery",
  "edhoc",
  "observe",
  "server",
  "software-crypto",
], optional = true }
rand_core = { version = "0.10.1", default-features = false, optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = "1.2.0"
edge-mdns = { version = "0.8.0", default-features = false, features = ["io"], optional = true }
edge-nal = { version = "0.7.0", optional = true }
# Its default features turn on unrelated embassy-net stack features.
edge-nal-embassy = { version = "0.9.0", default-features = false, features = ["medium-ethernet", "multicast", "proto-ipv4", "udp"], optional = true }
embassy-executor = "0.10.0"
embassy-futures  = "0.1.2"
embassy-net      = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp"] }
embassy-sync     = "0.8.0"
embassy-time     = "0.5.1"
esp-alloc        = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-hal-smartled = { version = "0.18.0", features = ["esp32c6"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
esp-radio   = { version = "1.0.0-beta.1", features = ["esp32c6", "log-04", "unstable", "wifi"] }
esp-hal-ota = { version = "0.7.2", features = ["esp32c6"] }
esp-storage = { version = "0.10.0", features = ["esp32c6", "embedded-storage"] }
embedded-io-async = "0.7.0"
embedded-storage = "0.3.2"
embassy-embedded-hal = "0.6.0"
mbedtls-rs = { git = "https://github.com/esp-rs/mbedtls-rs", rev = "07aeabb493ac5c71b06199414807cf49d899dec6", default-features = false, features = ["tls", "esp32c6", "hook-wall-clock", "ssl-out-content-len-2048"], optional = true }
time = { version = "0.3.55", default-features = false, optional = true }
mai-coap = { git = "https://github.com/snabb/mai-coap.git", rev = "d83f3c4da63a67273a858fc96b7fd032d82676bf", default-features = false, features = ["embassy-net-ipv4", "embassy-time"], optional = true }
esp-rtos    = { version = "0.4.0", features = ["embassy", "esp-radio", "esp32c6", "log-04"] }
minimq      = { version = "0.13.5", default-features = false, optional = true }
static_cell = "2.1.1"

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
mbedtls-rs = { git = "https://github.com/esp-rs/mbedtls-rs", rev = "07aeabb493ac5c71b06199414807cf49d899dec6" }
critical-section = { version = "1.2.0", features = ["std"] }
mai-coap = { git = "https://github.com/snabb/mai-coap.git", rev = "d83f3c4da63a67273a858fc96b7fd032d82676bf", default-features = false, features = ["client", "std"] }

[build-dependencies]
x509-cert = { version = "0.3.0", default-features = false, features = ["std"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
time = { version = "0.3.55", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
