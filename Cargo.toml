[package]
description  = "Bare-metal ESP32-C6 LED strip firmware with Wi-Fi and Home Assistant MQTT control"
edition      = "2024"
keywords     = ["esp32", "led", "mqtt", "no-std", "ws2812"]
license      = "MIT"
name         = "esp32-led-mqtt"
readme       = "README.md"
repository   = "https://github.com/snabb/esp32-led-mqtt"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "esp32-led-mqtt"
path = "./src/main.rs"

[dependencies]
smart-leds = "0.4.0"
heapless = { version = "0.9.3", features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde-json-core = "0.7.0"
sha2 = { version = "0.11.1", default-features = false }
sequential-storage = "8.0.2"
embedded-storage-async = "0.4.1"

[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-futures  = "0.1.2"
embassy-net      = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp"] }
embassy-sync     = "0.8.0"
embassy-time     = "0.5.1"
esp-alloc        = { version = "0.11.0", features = ["esp32c6"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32c6",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-hal = { version = "1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-hal-smartled = { version = "0.18.0", features = ["esp32c6"] }
esp-println = { version = "0.18.0", features = ["esp32c6", "log-04"] }
esp-radio   = { version = "1.0.0-beta.1", features = ["esp32c6", "log-04", "unstable", "wifi"] }
esp-hal-ota = { version = "0.7.2", features = ["esp32c6"] }
esp-storage = { version = "0.10.0", features = ["esp32c6", "embedded-storage"] }
embedded-io-async = "0.7.0"
embedded-storage = "0.3.2"
embassy-embedded-hal = "0.6.0"
mbedtls-rs = { version = "0.3.0", default-features = false, features = ["tls", "esp32c6", "hook-wall-clock", "ssl-out-content-len-2048"] }
time = { version = "0.3.55", default-features = false }
esp-rtos    = { version = "0.4.0", features = ["embassy", "esp-radio", "esp32c6", "log-04"] }
log         = "0.4.35"
minimq      = { version = "0.13.5", default-features = false }
static_cell = "2.1.1"

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }

[build-dependencies]
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
time = { version = "0.3.55", default-features = false }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
