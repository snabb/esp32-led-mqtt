name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Check formatting
        run: cargo fmt --check

      - name: Run host tests
        run: cargo test --lib --target x86_64-unknown-linux-gnu

      - name: Run host tests with CoAP
        run: cargo test --lib --target x86_64-unknown-linux-gnu --features coap

      - name: Check the CoAP host example
        run: cargo check --example coap_host_server --target x86_64-unknown-linux-gnu --features coap

      - name: Check firmware
        run: cargo check --target riscv32imac-unknown-none-elf

      - name: Check firmware without control planes
        run: cargo check --target riscv32imac-unknown-none-elf --no-default-features

      - name: Check firmware with MQTT only
        run: cargo check --target riscv32imac-unknown-none-elf --no-default-features --features mqtt

      - name: Check firmware with CoAP
        run: cargo check --target riscv32imac-unknown-none-elf --features coap

      - name: Check firmware with CoAP only
        run: cargo check --target riscv32imac-unknown-none-elf --no-default-features --features coap

      - name: Run Clippy with OTA enabled
        env:
          OTA_ALLOWED_HOSTS: updates.example.invalid
          OTA_ROLLBACK_BOOTLOADER: "1"
        run: cargo clippy --target riscv32imac-unknown-none-elf -- -D warnings

      - name: Run Clippy without control planes
        env:
          OTA_ALLOWED_HOSTS: updates.example.invalid
          OTA_ROLLBACK_BOOTLOADER: "1"
        run: cargo clippy --target riscv32imac-unknown-none-elf --no-default-features -- -D warnings

      - name: Run Clippy with MQTT only
        env:
          OTA_ALLOWED_HOSTS: updates.example.invalid
          OTA_ROLLBACK_BOOTLOADER: "1"
        run: cargo clippy --target riscv32imac-unknown-none-elf --no-default-features --features mqtt -- -D warnings

      - name: Run Clippy with CoAP
        env:
          OTA_ALLOWED_HOSTS: updates.example.invalid
          OTA_ROLLBACK_BOOTLOADER: "1"
        run: cargo clippy --target riscv32imac-unknown-none-elf --features coap -- -D warnings

      - name: Run Clippy with CoAP only
        env:
          OTA_ALLOWED_HOSTS: updates.example.invalid
          OTA_ROLLBACK_BOOTLOADER: "1"
        run: cargo clippy --target riscv32imac-unknown-none-elf --no-default-features --features coap -- -D warnings
